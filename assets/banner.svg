<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#0a0f1d"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyberGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="goldGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient><pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-width=".7" d="M 40 0 L 0 0 0 40" opacity=".6"/><circle cx="40" cy="40" r="1" fill="#334155" opacity=".8"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-subtle" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{opacity:.25;transform:scale(1) translate(0,0)}50%{opacity:.55;transform:scale(1.15) translate(20px,-15px)}}@keyframes pulseOrb2{0%{opacity:.2;transform:scale(1.1) translate(0,0)}50%{opacity:.45;transform:scale(.9) translate(-25px,20px)}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatPillLag{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes beamFlow{0%{stroke-dashoffset:400}}@keyframes scanline{0%{transform:translateY(-50px);opacity:0}50%{opacity:.3}}.bg-orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.bg-orb-2{animation:pulseOrb2 10s ease-in-out infinite;transform-origin:1000px 300px}.pill-float-1{animation:floatPill 6s ease-in-out infinite}.pill-float-2{animation:floatPillLag 7s ease-in-out infinite}.animated-beam{stroke-dasharray:20,15;animation:beamFlow 12s linear infinite}.scanner-beam{animation:scanline 7s ease-in-out infinite}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}.title-text{font-size:42px;font-weight:800;letter-spacing:-.5px;fill:url(#primaryGrad)}.subtitle-text{font-size:19px;font-weight:500;letter-spacing:.2px;fill:#94a3b8}.badge-label{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.8px}</style><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" fill="url(#gridPattern)"/><g id="dynamic-ambient-background"><circle cx="220" cy="120" r="180" fill="#38bdf8" class="bg-orb-1" filter="url(#glow)"/><circle cx="980" cy="280" r="220" fill="#a855f7" class="bg-orb-2" filter="url(#glow)"/><circle cx="600" cy="200" r="260" fill="#3b82f6" filter="url(#glow)" opacity=".12"/></g><g id="dynamic-network-lines" opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 80 Q 300 20 600 80 T 1150 60" class="animated-beam"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 50 360 Q 400 390 750 340 T 1150 360" class="animated-beam"/><circle cx="300" cy="45" r="4" fill="#38bdf8" filter="url(#glow-subtle)"/><circle cx="600" cy="80" r="5" fill="#818cf8" filter="url(#glow-subtle)"/><circle cx="900" cy="48" r="4" fill="#c084fc" filter="url(#glow-subtle)"/><circle cx="400" cy="375" r="4" fill="#a855f7" filter="url(#glow-subtle)"/><circle cx="750" cy="340" r="5" fill="#38bdf8" filter="url(#glow-subtle)"/></g><line x1="0" x2="1200" y1="0" y2="0" stroke="#38bdf8" stroke-width="1.5" class="scanner-beam" filter="url(#glow-subtle)"/><g id="foreground-content" transform="translate(60, 45)"><rect width="1080" height="330" x="0" y="0" fill="#0b1120" fill-opacity=".75" stroke="#334155" stroke-width="1.2" filter="url(#glow-subtle)" rx="20"/><g transform="translate(380, 28)"><rect width="320" height="32" x="0" y="0" fill="#1e293b" stroke="#3b82f6" stroke-width="1" rx="16"/><circle cx="20" cy="16" r="5" fill="#10b981" filter="url(#glow-subtle)"/><text x="36" y="21" fill="#cbd5e1" class="badge-label">CURATED IDENTITY &amp; SECRETS</text><text x="250" y="21" fill="#38bdf8" class="badge-label">2026 EDITION</text></g><text x="540" y="115" class="title-text" text-anchor="middle">API Authentication &amp; Credential Management</text><text x="540" y="155" class="subtitle-text" text-anchor="middle">Automated Secrets Sprawl Defense • Dynamic Brokerage • Zero Trust • AI Agent Identity</text><g><g class="pill-float-1" transform="translate(90, 200) translate(0, 0)"><rect width="200" height="52" fill="#1e293b" fill-opacity=".9" stroke="#38bdf8" stroke-width="1.2" rx="12"/><text x="24" y="32" font-family="sans-serif" font-size="20">⚡</text><text x="56" y="32" fill="#f8fafc" class="badge-label">Dynamic Secrets</text></g><g class="pill-float-2" transform="translate(90, 200) translate(230, 0)"><rect width="200" height="52" fill="#1e293b" fill-opacity=".9" stroke="#818cf8" stroke-width="1.2" rx="12"/><text x="24" y="32" font-family="sans-serif" font-size="20">🔐</text><text x="56" y="32" fill="#f8fafc" class="badge-label">Self-Hosted Vaults</text></g><g class="pill-float-1" transform="translate(90, 200) translate(460, 0)"><rect width="200" height="52" fill="#1e293b" fill-opacity=".9" stroke="#c084fc" stroke-width="1.2" rx="12"/><text x="24" y="32" font-family="sans-serif" font-size="20">🤖</text><text x="56" y="32" fill="#f8fafc" class="badge-label">AI Agent Identity</text></g><g class="pill-float-2" transform="translate(90, 200) translate(690, 0)"><rect wid