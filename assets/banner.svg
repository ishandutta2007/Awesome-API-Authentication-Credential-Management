<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Accent Glowing Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#334155" opacity="0.8" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations for Dynamic Effects (Always in background) */
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.55; transform: scale(1.15) translate(20px, -15px); }
    }
    @keyframes pulseOrb2 {
      0%, 100% { opacity: 0.2; transform: scale(1.1) translate(0, 0); }
      50% { opacity: 0.45; transform: scale(0.9) translate(-25px, 20px); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPillLag {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.3; }
      100% { transform: translateY(450px); opacity: 0; }
    }

    .bg-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .bg-orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .pill-float-1 {
      animation: floatPill 6s ease-in-out infinite;
    }
    .pill-float-2 {
      animation: floatPillLag 7s ease-in-out infinite;
    }
    .animated-beam {
      stroke-dasharray: 20, 15;
      animation: beamFlow 12s linear infinite;
    }
    .scanner-beam {
      animation: scanline 7s ease-in-out infinite;
    }

    /* Typography */
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: url(#primaryGrad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS: Glowing Orbs -->
  <g id="dynamic-ambient-background">
    <circle class="bg-orb-1" cx="220" cy="120" r="180" fill="#38bdf8" filter="url(#glow)" />
    <circle class="bg-orb-2" cx="980" cy="280" r="220" fill="#a855f7" filter="url(#glow)" />
    <circle cx="600" cy="200" r="260" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  </g>

  <!-- DYNAMIC BACKGROUND CONNECTIVITY LINES & CIRCUITS -->
  <g id="dynamic-network-lines" opacity="0.45">
    <path class="animated-beam" d="M 50 80 Q 300 20 600 80 T 1150 60" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="animated-beam" d="M 50 360 Q 400 390 750 340 T 1150 360" fill="none" stroke="#a855f7" stroke-width="2" />
    <!-- Ambient circuit nodes -->
    <circle cx="300" cy="45" r="4" fill="#38bdf8" filter="url(#glow-subtle)" />
    <circle cx="600" cy="80" r="5" fill="#818cf8" filter="url(#glow-subtle)" />
    <circle cx="900" cy="48" r="4" fill="#c084fc" filter="url(#glow-subtle)" />
    <circle cx="400" cy="375" r="4" fill="#a855f7" filter="url(#glow-subtle)" />
    <circle cx="750" cy="340" r="5" fill="#38bdf8" filter="url(#glow-subtle)" />
  </g>

  <!-- Subtle Scanning Laser Line -->
  <line class="scanner-beam" x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-subtle)" />

  <!-- FOREGROUND CARD CONTAINER (Guarantees Title & Subtitle Clarity) -->
  <g id="foreground-content" transform="translate(60, 45)">
    <!-- Main Content Background Plate -->
    <rect x="0" y="0" width="1080" height="330" rx="20" fill="#0b1120" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" filter="url(#glow-subtle)" />

    <!-- Top Status Badge Pill -->
    <g transform="translate(380, 28)">
      <rect x="0" y="0" width="320" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <circle cx="20" cy="16" r="5" fill="#10b981" filter="url(#glow-subtle)" />
      <text x="36" y="21" class="badge-label" fill="#cbd5e1">CURATED IDENTITY &amp; SECRETS</text>
      <text x="250" y="21" class="badge-label" fill="#38bdf8">2026 EDITION</text>
    </g>

    <!-- Foreground Title (Crisp, High-Contrast, Foreground) -->
    <text x="540" y="115" text-anchor="middle" class="title-text">
      API Authentication &amp; Credential Management
    </text>

    <!-- Foreground Subtitle -->
    <text x="540" y="155" text-anchor="middle" class="subtitle-text">
      Automated Secrets Sprawl Defense • Dynamic Brokerage • Zero Trust • AI Agent Identity
    </text>

    <!-- Feature Showcase Floating Badges (Inside Fore Plate) -->
    <g transform="translate(90, 200)">
      <!-- Pill 1: Dynamic Secrets -->
      <g class="pill-float-1" transform="translate(0, 0)">
        <rect width="200" height="52" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
        <text x="24" y="32" font-family="sans-serif" font-size="20">⚡</text>
        <text x="56" y="32" class="badge-label" fill="#f8fafc">Dynamic Secrets</text>
      </g>

      <!-- Pill 2: Vault Infrastructure -->
      <g class="pill-float-2" transform="translate(230, 0)">
        <rect width="200" height="52" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" />
        <text x="24" y="32" font-family="sans-serif" font-size="20">🔐</text>
        <text x="56" y="32" class="badge-label" fill="#f8fafc">Self-Hosted Vaults</text>
      </g>

      <!-- Pill 3: AI Agent Auth -->
      <g class="pill-float-1" transform="translate(460, 0)">
        <rect width="200" height="52" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.2" />
        <text x="24" y="32" font-family="sans-serif" font-size="20">🤖</text>
        <text x="56" y="32" class="badge-label" fill="#f8fafc">AI Agent Identity</text>
      </g>

      <!-- Pill 4: Zero Trust -->
      <g class="pill-float-2" transform="translate(690, 0)">
        <rect width="205" height="52" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#34d399" stroke-width="1.2" />
        <text x="24" y="32" font-family="sans-serif" font-size="20">🛡️</text>
        <text x="56" y="32" class="badge-label" fill="#f8fafc">Zero-Trust &amp; PKI</text>
      </g>
    </g>

    <!-- Bottom Metric / Tagline Ribbon -->
    <g transform="translate(220, 290)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748b">
        TRACKING <tspan fill="#38bdf8">14+ LEADING OPEN-SOURCE REPOS</tspan> &amp; <tspan fill="#a855f7">10 ENTERPRISE SAAS PLATFORMS</tspan>
      </text>
    </g>
  </g>
</svg>
